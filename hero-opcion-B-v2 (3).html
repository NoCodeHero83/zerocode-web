<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Opción B — Índigo Vibrante</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .hero svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .label {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div class="hero">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>

      <!-- Base: oscuro arriba, índigo profundo abajo -->
      <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#0a0b14"/>
        <stop offset="45%"  stop-color="#0f1228"/>
        <stop offset="80%"  stop-color="#160e38"/>
        <stop offset="100%" stop-color="#000000"/>
      </linearGradient>

      <!-- Gran mancha índigo-azul — corazón, centro-bajo -->
      <radialGradient id="blob-indigo" cx="50%" cy="75%" r="62%">
        <stop offset="0%"   stop-color="#4f46e5" stop-opacity="0.85"/>
        <stop offset="30%"  stop-color="#3730c8" stop-opacity="0.60"/>
        <stop offset="60%"  stop-color="#221898" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="#000000"  stop-opacity="0"/>
      </radialGradient>

      <!-- Mancha azul real — centro -->
      <radialGradient id="blob-blue" cx="42%" cy="50%" r="48%">
        <stop offset="0%"   stop-color="#2563eb" stop-opacity="0.60"/>
        <stop offset="45%"  stop-color="#1d4ed8" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="#000000"  stop-opacity="0"/>
      </radialGradient>

      <!-- Mancha púrpura-violeta — derecha baja, como Superlist -->
      <radialGradient id="blob-purple" cx="78%" cy="78%" r="48%">
        <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.70"/>
        <stop offset="35%"  stop-color="#5b21b6" stop-opacity="0.45"/>
        <stop offset="70%"  stop-color="#3b0e8a" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#000000"  stop-opacity="0"/>
      </radialGradient>

      <!-- Mancha rosa-fucsia muy suave — borde inferior derecho -->
      <radialGradient id="blob-rose" cx="88%" cy="95%" r="40%">
        <stop offset="0%"   stop-color="#db2777" stop-opacity="0.45"/>
        <stop offset="45%"  stop-color="#9d174d" stop-opacity="0.20"/>
        <stop offset="100%" stop-color="#000000"  stop-opacity="0"/>
      </radialGradient>

      <!-- Acento cálido izquierda baja -->
      <radialGradient id="blob-warm-left" cx="12%" cy="80%" r="38%">
        <stop offset="0%"   stop-color="#6d28d9" stop-opacity="0.45"/>
        <stop offset="55%"  stop-color="#4c1d95" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#000000"  stop-opacity="0"/>
      </radialGradient>

      <!-- Punto de luz central — el "sol" índigo -->
      <radialGradient id="hotspot" cx="50%" cy="62%" r="22%">
        <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.50"/>
        <stop offset="50%"  stop-color="#7c3aed" stop-opacity="0.20"/>
        <stop offset="100%" stop-color="#000000"  stop-opacity="0"/>
      </radialGradient>

      <!-- Vignette superior oscura -->
      <linearGradient id="vig-top" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#0a0b14" stop-opacity="1"/>
        <stop offset="30%"  stop-color="#0a0b14" stop-opacity="0"/>
      </linearGradient>

      <!-- Vignette inferior negro -->
      <linearGradient id="vig-bottom" x1="0" y1="0" x2="0" y2="1">
        <stop offset="58%"  stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
      </linearGradient>

      <!-- Viñetas laterales -->
      <linearGradient id="vig-left" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#000000" stop-opacity="0.55"/>
        <stop offset="22%"  stop-color="#000000" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="vig-right" x1="1" y1="0" x2="0" y2="0">
        <stop offset="0%"   stop-color="#000000" stop-opacity="0.40"/>
        <stop offset="20%"  stop-color="#000000" stop-opacity="0"/>
      </linearGradient>

    </defs>

    <!-- Base -->
    <rect width="1440" height="900" fill="url(#base)"/>

    <!-- Manchas de color -->
    <rect width="1440" height="900" fill="url(#blob-indigo)"/>
    <rect width="1440" height="900" fill="url(#blob-blue)"/>
    <rect width="1440" height="900" fill="url(#blob-purple)"/>
    <rect width="1440" height="900" fill="url(#blob-rose)"/>
    <rect width="1440" height="900" fill="url(#blob-warm-left)"/>
    <rect width="1440" height="900" fill="url(#hotspot)"/>

    <!-- Viñetas -->
    <rect width="1440" height="900" fill="url(#vig-top)"/>
    <rect width="1440" height="900" fill="url(#vig-bottom)"/>
    <rect width="1440" height="900" fill="url(#vig-left)"/>
    <rect width="1440" height="900" fill="url(#vig-right)"/>

  </svg>
  <div class="label">Opción B — Índigo vibrante (estilo Superlist)</div>
</div>
</body>
</html>
