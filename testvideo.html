<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Video</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 60px 20px;
      gap: 60px;
    }

    .video-container {
      width: 100%;
      max-width: 1000px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.06);
    }

    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      display: block;
    }

    .calendly-wrapper {
      width: 100%;
      max-width: 1000px;
      border-radius: 24px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.04);
    }
  </style>
</head>

<body>

  <div class="video-container">
    <iframe
      src="https://www.youtube.com/embed/xt6APM4HtqI"
      allowfullscreen>
    </iframe>
  </div>

  <div class="calendly-wrapper">
    <!-- Principio del widget integrado de Calendly -->
    <div 
      class="calendly-inline-widget"
      data-url="https://calendly.com/andres-diaz-/llamada-de-diagnostico-zerocode?hide_event_type_details=1&hide_gdpr_banner=1&background_color=ffffff00&text_color=ffffff&primary_color=597395"
      style="min-width:320px;height:700px;">
    </div>

    <script 
      type="text/javascript"
      src="https://assets.calendly.com/assets/external/widget.js"
      async>
    </script>
    <!-- Final del widget integrado de Calendly -->
  </div>

</body>
</html>
